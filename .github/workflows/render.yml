name: Render Remotion Video
run-name: Render #${{ inputs.jobId }} - ${{ inputs.title }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Unique Job ID'
        required: true
        type: string
      title:
        description: 'Video Title'
        required: true
        type: string
      durationInFrames:
        description: 'Duration in frames'
        required: true
        type: string
      fps:
        description: 'Frames per second'
        required: true
        type: string
      width:
        description: 'Video width'
        required: true
        type: string
      height:
        description: 'Video height'
        required: true
        type: string
      tsxCodeBase64:
        description: 'Base64 encoded DynamicVideo.tsx code'
        required: true
        type: string
      audioConfigBase64:
        description: 'Base64 encoded JSON for AI Voiceover scenes & BGM mood'
        required: false
        type: string
      callbackUrl:
        description: 'MCP Server webhook callback URL'
        required: false
        type: string
      mode:
        description: 'Render mode: video or still'
        required: false
        default: 'video'
        type: string
      stillFrame:
        description: 'Frame number for still mode'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules and Remotion Browser
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/remotion
            node_modules
          key: remotion-deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies (Full Remotion Ecosystem)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          npm install --legacy-peer-deps

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure --quiet

      - name: Prepare DynamicVideo.tsx, Pre-fetch External Assets & Guard Imports
        env:
          TSX_B64: ${{ inputs.tsxCodeBase64 }}
          DURATION: ${{ inputs.durationInFrames }}
          FPS: ${{ inputs.fps }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
        run: |
          mkdir -p public
          node scripts/prepare-render.mjs

      - name: Render Video or Still with Remotion
        id: render_step
        run: |
          mkdir -p outputs
          set +e
          if [ "${{ inputs.mode }}" = "still" ]; then
            npx remotion still src/remotion/index.ts DynamicVideo outputs/still-${{ inputs.jobId }}.png \
              --frame=${{ inputs.stillFrame || '0' }} \
              --public-dir=public \
              --gl=swangle \
              --log=error \
              --chromium-options="--disable-dev-shm-usage --no-sandbox" 2> outputs/error-${{ inputs.jobId }}.txt
            EXIT_CODE=$?
          else
            npx remotion render src/remotion/index.ts DynamicVideo outputs/video-${{ inputs.jobId }}.mp4 \
              --public-dir=public \
              --gl=swangle \
              --codec=h264 \
              --crf=18 \
              --preset=faster \
              --concurrency=100% \
              --log=error \
              --timeout=60000 \
              --chromium-options="--disable-dev-shm-usage --no-sandbox" 2> outputs/error-${{ inputs.jobId }}.txt
            EXIT_CODE=$?
          fi
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Render failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          else
            rm -f outputs/error-${{ inputs.jobId }}.txt
          fi

      - name: Upload Error Log on Failure (For Gemini Self-Healing Diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-store"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rendered Videos Storage" --notes "Automated storage for Remotion MCP rendered MP4 files"
          fi
          if [ -f "outputs/error-${{ inputs.jobId }}.txt" ]; then
            gh release upload "$TAG" "outputs/error-${{ inputs.jobId }}.txt" --clobber || true
          fi

      - name: Publish Video or Still to GitHub Release (Free Unlimited CDN Link)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-store"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rendered Videos Storage" --notes "Automated storage for Remotion MCP rendered MP4 files"
          fi
          if [ -f "outputs/video-${{ inputs.jobId }}.mp4" ]; then
            gh release upload "$TAG" "outputs/video-${{ inputs.jobId }}.mp4" --clobber
          fi
          if [ -f "outputs/still-${{ inputs.jobId }}.png" ]; then
            gh release upload "$TAG" "outputs/still-${{ inputs.jobId }}.png" --clobber
          fi
