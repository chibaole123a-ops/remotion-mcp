name: Render Remotion Video
run-name: Render #${{ inputs.jobId }} - ${{ inputs.title }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Unique Job ID'
        required: true
        type: string
      title:
        description: 'Video Title'
        required: true
        type: string
      durationInFrames:
        description: 'Duration in frames'
        required: true
        type: string
      fps:
        description: 'Frames per second'
        required: true
        type: string
      width:
        description: 'Video width'
        required: true
        type: string
      height:
        description: 'Video height'
        required: true
        type: string
      tsxCodeBase64:
        description: 'Base64 encoded DynamicVideo.tsx code'
        required: true
        type: string
      audioConfigBase64:
        description: 'Base64 encoded JSON for AI Voiceover scenes & BGM mood'
        required: false
        type: string
      callbackUrl:
        description: 'MCP Server webhook callback URL'
        required: false
        type: string
      mode:
        description: 'Render mode: video or still'
        required: false
        default: 'video'
        type: string
      stillFrame:
        description: 'Frame number for still mode'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules and Remotion Browser
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/remotion
            node_modules
          key: remotion-deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies (Full Remotion Ecosystem)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          npm install --legacy-peer-deps

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure --quiet

      - name: Install Python Edge-TTS, yt-dlp & PO Token Provider for Autonomous Audio Extraction
        run: |
          # ffmpeg and curl are pre-installed on GitHub Actions Ubuntu runners; avoid fragile apt update hangs
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl || true
          fi
          python -m pip install --upgrade edge-tts mutagen yt-dlp bgutil-ytdlp-pot-provider
          # Run official docker container for BotGuard Proof-of-Origin Token Provider
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
          sleep 3
          curl -s http://127.0.0.1:4416/ping || echo "POT provider initialized"

      - name: Prepare YouTube Cookies if configured
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "🍪 Loaded YouTube cookies from repository secret."
          fi

      - name: Generate AI Voiceover & Audio Telemetry
        env:
          AUDIO_B64: ${{ inputs.audioConfigBase64 }}
          FPS: ${{ inputs.fps }}
          DURATION: ${{ inputs.durationInFrames }}
        run: |
          mkdir -p public src/remotion/public
          node scripts/generate-studio-audio.mjs

      - name: Prepare DynamicVideo.tsx, Pre-fetch External Assets & Guard Imports
        env:
          TSX_B64: ${{ inputs.tsxCodeBase64 }}
          DURATION: ${{ inputs.durationInFrames }}
          FPS: ${{ inputs.fps }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
        run: |
          mkdir -p public
          node scripts/prepare-render.mjs

      - name: Render Video or Still with Remotion
        id: render_step
        run: |
          mkdir -p outputs
          set +e
          if [ "${{ inputs.mode }}" = "still" ]; then
            npx remotion still src/remotion/index.ts DynamicVideo outputs/still-${{ inputs.jobId }}.png \
              --frame=${{ inputs.stillFrame || '0' }} \
              --scale=0.67 \
              --public-dir=public \
              --gl=swangle \
              --log=error \
              --chromium-options="--disable-dev-shm-usage --no-sandbox" 2> outputs/error-${{ inputs.jobId }}.txt
            EXIT_CODE=$?
          else
            npx remotion render src/remotion/index.ts DynamicVideo outputs/video-${{ inputs.jobId }}.mp4 \
              --public-dir=public \
              --gl=swangle \
              --codec=h264 \
              --crf=22 \
              --preset=veryfast \
              --concurrency=100% \
              --disposition=rm \
              --memory-limit=4096 \
              --log=error \
              --timeout=120000 \
              --chromium-options="--disable-dev-shm-usage --no-sandbox" 2> outputs/error-${{ inputs.jobId }}.txt
            EXIT_CODE=$?
          fi
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Render failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          else
            rm -f outputs/error-${{ inputs.jobId }}.txt
            if [ "${{ inputs.mode }}" != "still" ] && [ -f "outputs/video-${{ inputs.jobId }}.mp4" ]; then
              JOB_ID="${{ inputs.jobId }}" node scripts/measure-video-qc.mjs || true
            fi
          fi

      - name: Upload Error Log on Failure (For Gemini Self-Healing Diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-store"
          mkdir -p outputs
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rendered Videos Storage" --notes "Automated storage for Remotion MCP rendered MP4 files"
          fi
          if [ ! -f "outputs/error-${{ inputs.jobId }}.txt" ]; then
            echo "Workflow failed during step before Remotion render (e.g. dependencies, audio synthesis or preparation). Check GitHub run logs." > "outputs/error-${{ inputs.jobId }}.txt"
          fi
          gh release upload "$TAG" "outputs/error-${{ inputs.jobId }}.txt" --clobber || true

      - name: Publish Video or Still to GitHub Release (Free Unlimited CDN Link)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-store"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rendered Videos Storage" --notes "Automated storage for Remotion MCP rendered MP4 files"
          fi
          if [ -f "outputs/video-${{ inputs.jobId }}.mp4" ]; then
            gh release upload "$TAG" "outputs/video-${{ inputs.jobId }}.mp4" --clobber
          fi
          if [ -f "outputs/qc-${{ inputs.jobId }}.json" ]; then
            gh release upload "$TAG" "outputs/qc-${{ inputs.jobId }}.json" --clobber || true
          fi
          if [ -f "outputs/still-${{ inputs.jobId }}.png" ]; then
            gh release upload "$TAG" "outputs/still-${{ inputs.jobId }}.png" --clobber
          fi
