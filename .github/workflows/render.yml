name: Render Remotion Video
run-name: Render #${{ inputs.jobId }} - ${{ inputs.title }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Unique Job ID'
        required: true
        type: string
      title:
        description: 'Video Title'
        required: true
        type: string
      durationInFrames:
        description: 'Duration in frames'
        required: true
        type: string
      fps:
        description: 'Frames per second'
        required: true
        type: string
      width:
        description: 'Video width'
        required: true
        type: string
      height:
        description: 'Video height'
        required: true
        type: string
      tsxCodeBase64:
        description: 'Base64 encoded DynamicVideo.tsx code'
        required: true
        type: string
      audioConfigBase64:
        description: 'Base64 encoded JSON for AI Voiceover scenes & BGM mood'
        required: false
        type: string
      callbackUrl:
        description: 'MCP Server webhook callback URL'
        required: false
        type: string
      mode:
        description: 'Render mode: video, still, or stitch'
        required: false
        default: 'video'
        type: string
      stillFrame:
        description: 'Frame number for still mode'
        required: false
        default: '0'
        type: string
      stillFrames:
        description: 'Comma-separated frame numbers for multi-frame Contact Sheet preview'
        required: false
        default: ''
        type: string
      audioMasteringBase64:
        description: 'Base64 encoded JSON for FFmpeg studio audio mastering'
        required: false
        default: ''
        type: string
      payloadAssetName:
        description: 'Optional GitHub Release JSON asset name for large payloads or stitch manifests'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hydrate Offloaded Job Payload (Bypass 65KB Limit)
        if: inputs.payloadAssetName != ''
        env:
          PAYLOAD_ASSET_NAME: ${{ inputs.payloadAssetName }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/hydrate-job-payload.mjs

      - name: Cache node_modules and Remotion Browser
        if: inputs.mode != 'stitch'
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/remotion
            node_modules
          key: remotion-deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies (Full Remotion Ecosystem)
        if: inputs.mode != 'stitch' && steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          npm install --legacy-peer-deps

      - name: Ensure Remotion Browser
        if: inputs.mode != 'stitch'
        run: npx remotion browser ensure --quiet

      - name: Ensure FFmpeg CLI (Shared for Previews, Stitch & Mastering)
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl
          fi

      - name: Cache Python Audio Tools (Edge-TTS & yt-dlp, Video Render Only)
        if: inputs.mode == 'video'
        id: cache_tts
        uses: actions/cache@v4
        with:
          path: ~/.tts-venv
          key: tts-tools-v1-${{ runner.os }}

      - name: Setup Python Edge-TTS, yt-dlp & Conditional YouTube POT (Video Render Only)
        if: inputs.mode == 'video'
        env:
          TSX_B64: ${{ inputs.tsxCodeBase64 }}
        run: |
          TTS_VENV="$HOME/.tts-venv"
          if [ "${{ steps.cache_tts.outputs.cache-hit }}" != "true" ] || [ ! -f "$TTS_VENV/bin/edge-tts" ]; then
            python -m venv "$TTS_VENV"
            "$TTS_VENV/bin/pip" install --upgrade pip
            "$TTS_VENV/bin/pip" install --upgrade edge-tts mutagen yt-dlp bgutil-ytdlp-pot-provider
          fi
          echo "$TTS_VENV/bin" >> "$GITHUB_PATH"
          if (echo "$TSX_B64" | base64 -d 2>/dev/null; cat outputs/hydrated-tsx.txt outputs/hydrated-audio.json 2>/dev/null || true) | grep -qiE "youtube\.com|youtu\.be"; then
            docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
            sleep 2
            curl -s http://127.0.0.1:4416/ping || echo "POT provider initialized"
          else
            echo "⚡ Direct audio / no YouTube URL detected — skipping Docker POT startup."
          fi

      - name: Cache CTC Forced Aligner & HuggingFace MMS Model
        if: inputs.mode == 'video'
        id: cache_ctc
        uses: actions/cache@v4
        with:
          path: |
            ~/.ctc-aligner-venv
            ~/.cache/huggingface
          key: ctc-aligner-cpu-v1-${{ runner.os }}

      - name: Setup CTC Acoustic Forced Aligner (CPU MMS-300M, Video Render Only)
        if: inputs.mode == 'video'
        run: |
          VENV_DIR="$HOME/.ctc-aligner-venv"
          if [ "${{ steps.cache_ctc.outputs.cache-hit }}" != "true" ] || [ ! -f "$VENV_DIR/bin/python" ]; then
            (
              python -m venv "$VENV_DIR"
              "$VENV_DIR/bin/pip" install --upgrade pip wheel setuptools pybind11
              "$VENV_DIR/bin/pip" install --upgrade --no-cache-dir torch torchcodec --index-url https://download.pytorch.org/whl/cpu
              "$VENV_DIR/bin/pip" install --upgrade --no-cache-dir git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git
            ) || echo "⚠️ CTC Forced Aligner install failed; falling back to SentenceBoundary word alignment."
          fi
          if [ -f "$VENV_DIR/bin/python" ]; then
            echo "ALIGNER_PYTHON=$VENV_DIR/bin/python" >> "$GITHUB_ENV"
            echo "⚡ CTC Acoustic Forced Aligner ready: $VENV_DIR/bin/python"
          fi

      - name: Prepare YouTube Cookies if configured
        if: inputs.mode == 'video'
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "🍪 Loaded YouTube cookies from repository secret."
          fi

      - name: Generate AI Voiceover & Audio Telemetry
        if: inputs.mode != 'stitch'
        env:
          AUDIO_B64: ${{ inputs.audioConfigBase64 }}
          FPS: ${{ inputs.fps }}
          DURATION: ${{ inputs.durationInFrames }}
          PREVIEW_MODE: ${{ inputs.mode == 'still' && 'true' || 'false' }}
        run: |
          mkdir -p public src/remotion/public
          node scripts/generate-studio-audio.mjs

      - name: Prepare DynamicVideo.tsx, Pre-fetch External Assets & Guard Imports
        if: inputs.mode != 'stitch'
        env:
          TSX_B64: ${{ inputs.tsxCodeBase64 }}
          DURATION: ${{ inputs.durationInFrames }}
          FPS: ${{ inputs.fps }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          PREVIEW_MODE: ${{ inputs.mode == 'still' && 'true' || 'false' }}
        run: |
          mkdir -p public
          node scripts/prepare-render.mjs

      - name: Render Video, Stitch Chapters, or Preview Still
        id: render_step
        env:
          JOB_ID: ${{ inputs.jobId }}
          STILL_FRAME: ${{ inputs.stillFrame || '0' }}
          STILL_FRAMES: ${{ inputs.stillFrames || '' }}
          AUDIO_MASTERING_B64: ${{ inputs.audioMasteringBase64 || '' }}
          VIDEO_TITLE: ${{ inputs.title }}
          TSX_B64: ${{ inputs.tsxCodeBase64 }}
          AUDIO_B64: ${{ inputs.audioConfigBase64 || '' }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          FPS: ${{ inputs.fps }}
          DURATION: ${{ inputs.durationInFrames }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p outputs
          set +e
          if [ "${{ inputs.mode }}" = "still" ]; then
            node scripts/render-preview-frames.mjs
            EXIT_CODE=$?
          elif [ "${{ inputs.mode }}" = "stitch" ]; then
            node scripts/stitch-chapters.mjs 2> outputs/error-${{ inputs.jobId }}.txt
            EXIT_CODE=$?
          else
            npx remotion render src/remotion/index.ts DynamicVideo outputs/video-${{ inputs.jobId }}.mp4 \
              --public-dir=public \
              --gl=swangle \
              --codec=h264 \
              --crf=19 \
              --preset=fast \
              --concurrency=100% \
              --disposition=rm \
              --memory-limit=4096 \
              --log=error \
              --timeout=120000 \
              --chromium-options="--disable-dev-shm-usage --no-sandbox" 2> outputs/error-${{ inputs.jobId }}.txt
            EXIT_CODE=$?
          fi
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Render failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          else
            rm -f outputs/error-${{ inputs.jobId }}.txt
            if [ "${{ inputs.mode }}" != "still" ] && [ -f "outputs/video-${{ inputs.jobId }}.mp4" ]; then
              node scripts/master-video-audio.mjs || true
              node scripts/measure-video-qc.mjs || true
              if [ "${{ inputs.mode }}" != "stitch" ]; then
                node scripts/save-project-source.mjs || true
              fi
            fi
          fi

      - name: Upload Error Log on Failure (For Gemini Self-Healing Diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-store"
          mkdir -p outputs
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rendered Videos Storage" --notes "Automated storage for Remotion MCP rendered MP4 files"
          fi
          if [ ! -f "outputs/error-${{ inputs.jobId }}.txt" ]; then
            echo "Workflow failed during step before Remotion render (e.g. dependencies, audio synthesis or preparation). Check GitHub run logs." > "outputs/error-${{ inputs.jobId }}.txt"
          fi
          gh release upload "$TAG" "outputs/error-${{ inputs.jobId }}.txt" --clobber || true

      - name: Publish Video or Still to GitHub Release (Free Unlimited CDN Link)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-store"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rendered Videos Storage" --notes "Automated storage for Remotion MCP rendered MP4 files"
          fi
          if [ -f "outputs/qc-${{ inputs.jobId }}.json" ]; then
            gh release upload "$TAG" "outputs/qc-${{ inputs.jobId }}.json" --clobber || true
          fi
          if [ -f "outputs/project-${{ inputs.jobId }}.json" ]; then
            gh release upload "$TAG" "outputs/project-${{ inputs.jobId }}.json" --clobber || true
          fi
          if [ -f "outputs/final-sheet-${{ inputs.jobId }}.jpg" ]; then
            gh release upload "$TAG" "outputs/final-sheet-${{ inputs.jobId }}.jpg" --clobber || true
          fi
          if [ -f "outputs/video-${{ inputs.jobId }}.mp4" ]; then
            gh release upload "$TAG" "outputs/video-${{ inputs.jobId }}.mp4" --clobber
          fi
          if [ -f "outputs/still-${{ inputs.jobId }}.png" ]; then
            gh release upload "$TAG" "outputs/still-${{ inputs.jobId }}.png" --clobber
          fi
